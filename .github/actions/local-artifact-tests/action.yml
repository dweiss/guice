name: 'Local Artifact Tests'
description: 'Publishes Guice to the local Maven repository and runs the example project against it.'

runs:
  using: "composite"
  steps:
    - name: 'Set up JDK'
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
      with:
        distribution: ${{ env.USE_JAVA_DISTRIBUTION }}
        java-version: ${{ env.USE_JAVA_VERSION }}
        cache: gradle
    - name: 'Delete any stale artifacts'
      run: rm -rf ~/.m2/repository/com/google/inject
      shell: bash
    - name: 'Publish to the local Maven repository'
      run: ./gradlew publishToMavenLocal --console=plain
      shell: bash
    - name: 'Build the example against the local artifacts'
      run: |
        GUICE_VERSION=$(sed -n 's/^version=//p' gradle.properties)
        ./gradlew -p examples/guice-demo test --console=plain -Pguice.version="$GUICE_VERSION"
      shell: bash
    - name: 'Clean up'
      run: rm -rf ~/.m2/repository/com/google/inject
      shell: bash
