name: 'Publish Snapshot'
description: 'Publish snapshot artifacts and latest API doc.'

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
      with:
        distribution: ${{ env.USE_JAVA_DISTRIBUTION }}
        java-version: ${{ env.USE_JAVA_VERSION }}
        cache: gradle
    - name: Publish Javadoc
      run: |
        chmod +x util/publish-latest-docs.sh
        ./util/publish-latest-docs.sh
      shell: bash
    - name: Publish Snapshot
      run: ./gradlew publishToMavenCentral --console=plain
      shell: bash
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.MAVEN_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.MAVEN_PASSWORD }}
