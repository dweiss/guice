rootProject.name = 'guice-parent'

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

// Project names double as Maven artifact ids.
def module = { String name, String dir ->
  include name
  project(":$name").projectDir = file(dir)
}

module 'guice-bom', 'bom'
module 'guice', 'core'
['assistedinject', 'dagger-adapter', 'grapher', 'jmx', 'jndi', 'persist',
 'servlet', 'spring', 'testlib', 'throwingproviders'].each {
  module "guice-$it", "extensions/$it"
}
